name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"

      - name: Build JAW.exe
        run: python tools/build_windows.py

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\JAW.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  JAW.exe" | Set-Content -Encoding ascii dist\JAW.exe.sha256
          Get-Item dist\JAW.exe | Format-List Name,Length,LastWriteTime
          Get-Content dist\JAW.exe.sha256

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JAW-windows-x64
          path: |
            dist/JAW.exe
            dist/JAW.exe.sha256
          if-no-files-found: error

      - name: Attach tagged build to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist\JAW.exe dist\JAW.exe.sha256 --clobber
          } else {
            gh release create $tag dist\JAW.exe dist\JAW.exe.sha256 --title "JAW $tag" --generate-notes
          }
