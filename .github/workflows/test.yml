name: Test

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - dev
  #     - main
  #     - "release/**"
  # pull_request:
  #   branches:
  #     - dev
  #     - main

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check src tests

      - name: Validate packaged templates
        shell: pwsh
        run: |
          python -c "import json,pathlib; json.loads(pathlib.Path('src/jaw/resources/default-user-v1.0.json').read_text(encoding='utf-8'))"
          python -c "import tomllib,pathlib; tomllib.loads(pathlib.Path('src/jaw/resources/config.example.toml').read_text(encoding='utf-8'))"

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Verify wheel runtime assets
        shell: pwsh
        run: |
          @'
          import zipfile
          from pathlib import Path

          wheels = list(Path("dist").glob("jaw-*.whl"))
          assert len(wheels) == 1, f"Expected one JAW wheel, found: {wheels}"

          required = {
              "jaw/dashboard.html",
              "jaw/custom_workspace.css",
              "jaw/custom_workspace.js",
              "jaw/document_workbench_transitions.css",
              "jaw/document_workbench_transitions.js",
              "jaw/resources/config.example.toml",
              "jaw/resources/default-user-v1.0.json",
              "jaw/resources/documents/cover_letter.tex.j2",
              "jaw/resources/fonts/README.md",
              "jaw/resources/fonts/Montserrat-Regular.ttf",
              "jaw/resources/fonts/OpenSans-Regular.ttf",
              "jaw/resources/fonts/QwitcherGrypen-Regular.ttf",
              "jaw/resources/fonts/licenses/Montserrat-OFL.txt",
              "jaw/resources/fonts/licenses/OpenSans-OFL.txt",
              "jaw/resources/fonts/licenses/QwitcherGrypen-OFL.txt",
          }

          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())

          missing = sorted(required - names)
          assert not missing, f"Wheel is missing runtime assets: {missing}"

          bundled_fonts = sorted(
              name
              for name in names
              if name.startswith("jaw/resources/fonts/")
              and Path(name).suffix.lower() in {".ttf", ".otf", ".ttc"}
          )
          assert bundled_fonts, "Wheel does not contain the bundled document fonts"
          print(
              f"Verified {len(required)} required runtime assets and "
              f"{len(bundled_fonts)} bundled fonts in {wheels[0].name}"
          )
          '@ | python -

      - name: Smoke test installed wheel
        shell: pwsh
        run: |
          python -m pip uninstall -y jaw
          $wheel = (Get-ChildItem dist\jaw-*.whl | Select-Object -First 1).FullName
          python -m pip install --no-deps $wheel
          @'
          from pathlib import Path
          import jaw
          from jaw.documents import tectonic as tectonic_module
          from jaw.web.assets import static_asset_for

          package_dir = Path(jaw.__file__).resolve().parent
          source_dir = (Path.cwd() / "src" / "jaw").resolve()
          assert package_dir != source_dir, f"Imported source checkout instead of installed wheel: {package_dir}"

          transition_asset = static_asset_for("/document-workbench-transitions.js")
          assert transition_asset is not None
          assert transition_asset.read()

          font_resources = tectonic_module.find_tectonic_search_path()
          assert font_resources is not None
          assert (font_resources / "README.md").is_file()
          assert (font_resources / "Montserrat-Regular.ttf").is_file()
          assert (font_resources / "OpenSans-Regular.ttf").is_file()
          assert (font_resources / "QwitcherGrypen-Regular.ttf").is_file()
          assert (font_resources / "licenses" / "Montserrat-OFL.txt").is_file()
          assert (font_resources / "licenses" / "OpenSans-OFL.txt").is_file()
          assert (font_resources / "licenses" / "QwitcherGrypen-OFL.txt").is_file()

          print(f"Installed-wheel smoke test passed from {package_dir}")
          '@ | python -
